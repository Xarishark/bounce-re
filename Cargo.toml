[package]
name = "bounce-re"
version = "1.0.0"
edition = "2021"
description = "Bounce RE: native PC port of the 2002 Nokia J2ME game Bounce"
license = "MIT"
repository = "https://github.com/Xarishark/bounce-re"
readme = "README.md"
keywords = ["game", "port", "j2me", "sdl3", "reverse-engineering"]
categories = ["games"]
publish = false

[[bin]]
name = "bounce"
path = "src/main.rs"

[dependencies]
png = "0.18"
# reading the player's JAR on first start
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
sha2 = "0.10"
embedded-graphics = "0.8"
# SDL3 is built from source and linked statically on every system, so the
# release is one self-contained program (SDL still loads X11/Wayland, audio
# and so on from the system at run time).
sdl3 = { version = "0.22", features = ["build-from-source-static"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
